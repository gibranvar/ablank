[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[[redirects]]
  from = "/api/send-brief"
  to = "/.netlify/functions/send-brief"
  status = 200

[[redirects]]
  from = "/api/send-contact"
  to = "/.netlify/functions/send-contact"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
